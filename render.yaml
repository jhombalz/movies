services:
  - type: web
    name: frame-movies
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -- --base=/
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: STREAM_API_KEY
        generateValue: true
      - key: PUBLIC_PLAYBACK
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://jhombalz.github.io,http://127.0.0.1:5173,http://localhost:5173
      - key: MAX_TORRENT_BYTES
        value: "4294967296"
